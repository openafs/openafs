#
# DKMS configuration for the OpenAFS kernel module.
#
# This file is installed as dkms.conf in the dkms-openafs package. The
# PACKAGE_VERSION placeholder is replaced with the package version when
# the package is built. See dkms(8) for a description of the settings.
#

PACKAGE_NAME="openafs"
PACKAGE_VERSION="@PACKAGE_VERSION@"

MAKE[0]='./configure --with-linux-kernel-headers=${kernel_source_dir}'
MAKE[0]+=' --with-linux-kernel-packaging'
MAKE[0]+=' && make'
MAKE[0]+=' && mv src/libafs/MODLOAD-*/openafs.ko .'
CLEAN=true

BUILT_MODULE_NAME[0]="$PACKAGE_NAME"
DEST_MODULE_LOCATION[0]="/extra/$PACKAGE_NAME/"
STRIP[0]=no
AUTOINSTALL=yes
NO_WEAK_MODULES=yes
